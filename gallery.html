<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#061206" />
  <meta name="description" content="Hinnom Rock Gallery — curated nature photography." />
  <title>Hinnom Rock — Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-2"></div>

  <main class="page">

    <header class="ph">
      <span class="ph-eyebrow">Visual Stories</span>
      <h1 class="ph-title">Our <em>Gallery</em></h1>
      <p class="ph-sub">A curated collection of nature's most breathtaking moments — captured and preserved.</p>
    </header>

    <!-- Filter -->
    <div class="gf-wrap reveal" role="group" aria-label="Gallery filters">
      <button class="gf-btn active" data-filter="all">All</button>
      <button class="gf-btn" data-filter="rock">Rock</button>
      <button class="gf-btn" data-filter="river">River</button>
      <button class="gf-btn" data-filter="sky">Sky</button>
      <button class="gf-btn" data-filter="memories">Memories</button>
    </div>

    <!-- Grid
         data-filter = category for filter tabs
         data-label  = caption shown in lightbox / hover
         To use your own images: change src="..." to e.g. src="images/photo1.jpg"
    -->
    <div class="gallery-grid" id="grid">

      <div class="g-item wide reveal" data-filter="rock" data-label="Rock formation" data-src="rock/rock-1.jpg">
        <img src="rock/rock-1.jpg" alt="Rock formation" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Rock formation</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="river" data-label="River bend" data-src="river/river-1.jpg">
        <img src="river/river-1.jpg" alt="River bend" loading="lazy" />
        <div class="g-overlay"><span class="g-label">River bend</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="sky" data-label="Sky view" data-src="sky/sky-1.jpg">
        <img src="sky/sky-1.jpg" alt="Sky view" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Sky view</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="memories" data-label="Memories" data-src="memories/memories-1.jpg">
        <img src="memories/memories-1.jpg" alt="Memories" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Memories</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="rock" data-label="Rock formation" data-src="rock/rock-2.jpg">
        <img src="rock/rock-2.jpg" alt="Rock formation" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Rock formation</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="river" data-label="River bend" data-src="river/river-2.jpg">
        <img src="river/river-2.jpg" alt="River bend" loading="lazy" />
        <div class="g-overlay"><span class="g-label">River bend</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="sky" data-label="Sky view" data-src="sky/sky-2.jpg">
        <img src="sky/sky-2.jpg" alt="Sky view" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Sky view</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="memories" data-label="Memories" data-src="memories/memories-2.jpg">
        <img src="memories/memories-2.jpg" alt="Memories" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Memories</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="rock" data-label="Ancient Rocks" data-src="rock/rock-3.jpg">
        <img src="rock/rock-3.jpg" alt="Ancient Rocks" loading="lazy" />
        <div class="g-overlay"><span class="g-label">Ancient Rocks</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

      <div class="g-item reveal" data-filter="river" data-label="CRiver bend" data-src="river/river-3.jpg">
        <img src="river/river-3.jpg" alt="River bend" loading="lazy" />
        <div class="g-overlay"><span class="g-label">River Bend</span></div>
        <div class="g-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></div>
      </div>

    </div>
  </main>

  <!-- Lightbox -->
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <img class="lb-img" id="lbImg" src="" alt="" />
    <div class="lb-caption" id="lbCaption"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="nav">
    <a href="index.html" class="nav-link" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="gallery.html" class="nav-link active" aria-label="Gallery">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>Gallery</span>
    </a>
    <a href="about.html" class="nav-link" aria-label="About">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>About</span>
    </a>
    <a href="contact.html" class="nav-link" aria-label="Contact">
      <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      <span>Contact</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
